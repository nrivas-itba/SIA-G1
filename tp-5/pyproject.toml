[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project]
name = "tp-5"
version = "0.1.0"
description = "Autoencoder implementation with a custom deep learning engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "rust-matmul",
    "tabulate>=0.10.0",
]

[project.scripts]
tp-5 = "tp_5.__main__:main"

[dependency-groups]
dev = [
    "maturin>=1.15.0",
]

[tool.uv.sources]
rust-matmul = { path = "rust" }
