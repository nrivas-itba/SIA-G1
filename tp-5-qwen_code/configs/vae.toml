# VAE configuration for TP5

Input: 35 pixels (5x7 binary images)
Latent space: 2 dimensions (mean + log_var)
Architecture: encoder 35 → h1 → 2 (mean) + 2 (log_var)
              decoder 2 → h1 → 35
