# Hyperparameter sweep configuration

N_trials: 30
Search space:
  learning_rate: loguniform(1e-4, 1e-1)
  batch_size: categorical([32, 64, 128, 256])
  encoder_layers: [64, 128, 256]
  activation: categorical(["sigmoid", "tanh"])
